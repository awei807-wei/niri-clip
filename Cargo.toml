[package]
name = "niri-clip"
version = "0.3.0"
edition = "2021"
rust-version = "1.92"
description = "Keyboard-first rich Wayland clipboard history overlay for niri"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0.103"
blake3 = "1.8.5"
dirs = "6.0.0"
gtk4 = { version = "0.11.4", features = ["v4_10"] }
gtk4-layer-shell = { version = "0.8.0", features = ["v1_3"] }
nucleo-matcher = "0.3.1"
os_pipe = "1.2.3"
# 0.40.1 uses std::cfg_select!, which is still unstable on Rust 1.93.
rusqlite = { version = "=0.39.0", default-features = false }
rustix = { version = "1.1.4", features = ["event"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"] }
wl-clipboard-rs = "0.9.3"

[dev-dependencies]
tempfile = "3.25.0"

[patch.crates-io]
# crates.io wayland-scanner 0.31.10 still pins vulnerable quick-xml 0.39.
# The vendored stable release applies upstream ec2d9328 + d07c4f91 for quick-xml 0.41.
wayland-scanner = { path = "vendor/wayland-scanner" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
